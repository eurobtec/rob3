[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rob3_ucsim"
version = "0.1.0"
description = "ROB3-specific ucSim simulation harness: drive the ROB3 8031 firmware in µCsim and read back its state"
readme = "src/rob3_ucsim/README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Andrei Kholodnyi" }]
keywords = ["rob3", "eurobtec", "ucsim", "8031", "mcs-51", "simulator", "robot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Emulators",
]
# Pure standard library — no runtime dependencies. Needs a `ucsim_51`/`s51`
# binary on PATH (or via UCSIM_51) and, for the interactive engine, the ROB3
# cl_hw .so modules; both live in / are referenced from the firmware repo.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/eurobtec/rob3"
"Protocol library" = "https://github.com/eurobtec/rob3_py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
