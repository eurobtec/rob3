[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbps-compiler"
version = "0.1.0"
description = "ROM-faithful compiler for the ROB3 Teach Box Programming System (TBPS) language"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ROB3 reverse-engineering project" }]
keywords = ["rob3", "teachbox", "tbps", "8031", "mcs51", "compiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
tbpsc = "tbps_compiler.cli:main"

[project.urls]
Homepage = "https://github.com/eurobtec/rob3"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tbps_compiler"]
branch = true
