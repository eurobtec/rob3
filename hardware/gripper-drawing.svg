<?xml version="1.0" encoding="UTF-8"?>
<!-- ROB3 gripper - 2D front view, drawn from bench photos + caliper
     measurements (photos not committed). Two-finger four-bar linkage.
     Dimensions are APPROXIMATE [INFER], scaled from the 5 mm graph-paper grid
     in the photos; replace with caliper [HW] values. 1 SVG unit = 1 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460"
     viewBox="-20 -20 760 460" font-family="sans-serif" font-size="11">

  <style>
    .body  { fill:#2b2b2b; stroke:#000; stroke-width:1.5; }
    .link  { fill:none; stroke:#2b2b2b; stroke-width:7; stroke-linecap:round; }
    .tip   { fill:#2b2b2b; stroke:#000; stroke-width:1; }
    .pivot { fill:#888; stroke:#000; stroke-width:1; }
    .dim   { stroke:#c0392b; stroke-width:0.8; fill:none; }
    .dimt  { fill:#c0392b; font-size:10px; }
    .lbl   { fill:#111; }
    .ttl   { font-size:14px; font-weight:bold; fill:#111; }
    .grid  { stroke:#dfe6ee; stroke-width:0.5; }
  </style>

  <!-- light 5mm grid to echo the graph paper -->
  <g class="grid">
    <!-- vertical -->
    <g>
      <line x1="0" y1="0" x2="0" y2="420"/><line x1="50" y1="0" x2="50" y2="420"/>
      <line x1="100" y1="0" x2="100" y2="420"/><line x1="150" y1="0" x2="150" y2="420"/>
      <line x1="200" y1="0" x2="200" y2="420"/><line x1="250" y1="0" x2="250" y2="420"/>
      <line x1="300" y1="0" x2="300" y2="420"/><line x1="350" y1="0" x2="350" y2="420"/>
      <line x1="400" y1="0" x2="400" y2="420"/><line x1="450" y1="0" x2="450" y2="420"/>
      <line x1="500" y1="0" x2="500" y2="420"/><line x1="550" y1="0" x2="550" y2="420"/>
      <line x1="600" y1="0" x2="600" y2="420"/><line x1="650" y1="0" x2="650" y2="420"/>
      <line x1="700" y1="0" x2="700" y2="420"/>
    </g>
    <g>
      <line x1="0" y1="0" x2="700" y2="0"/><line x1="0" y1="50" x2="700" y2="50"/>
      <line x1="0" y1="100" x2="700" y2="100"/><line x1="0" y1="150" x2="700" y2="150"/>
      <line x1="0" y1="200" x2="700" y2="200"/><line x1="0" y1="250" x2="700" y2="250"/>
      <line x1="0" y1="300" x2="700" y2="300"/><line x1="0" y1="350" x2="700" y2="350"/>
      <line x1="0" y1="400" x2="700" y2="400"/>
    </g>
  </g>

  <!-- =================== CLOSED (left) =================== -->
  <g transform="translate(0,0)">
    <text class="ttl" x="90" y="-5" text-anchor="middle">CLOSED</text>

    <!-- wrist hub / mount collar -->
    <rect class="body" x="70" y="0" width="40" height="22" rx="3"/>
    <!-- palm plate (cross-bar) -->
    <rect class="body" x="20" y="22" width="140" height="30" rx="4"/>
    <!-- mounting-hole dots -->
    <g class="pivot">
      <circle cx="55" cy="37" r="2.5"/><circle cx="75" cy="37" r="2.5"/>
      <circle cx="105" cy="37" r="2.5"/><circle cx="125" cy="37" r="2.5"/>
    </g>
    <!-- four-bar links: two per side converging to a V -->
    <!-- left finger -->
    <line class="link" x1="40" y1="52" x2="82" y2="150"/>
    <line class="link" x1="70" y1="52" x2="90" y2="150"/>
    <!-- right finger -->
    <line class="link" x1="140" y1="52" x2="98" y2="150"/>
    <line class="link" x1="110" y1="52" x2="90" y2="150"/>
    <!-- fingertips meeting (closed V) -->
    <polygon class="tip" points="82,150 98,150 90,195"/>
    <!-- pivots -->
    <g class="pivot">
      <circle cx="40" cy="52" r="3"/><circle cx="70" cy="52" r="3"/>
      <circle cx="110" cy="52" r="3"/><circle cx="140" cy="52" r="3"/>
    </g>
  </g>

  <!-- =================== OPEN (right) =================== -->
  <g transform="translate(360,0)">
    <text class="ttl" x="130" y="-5" text-anchor="middle">OPEN</text>

    <!-- wrist hub / mount collar -->
    <rect class="body" x="110" y="0" width="40" height="22" rx="3"/>
    <!-- palm plate (cross-bar) -->
    <rect class="body" x="60" y="22" width="140" height="30" rx="4"/>
    <g class="pivot">
      <circle cx="95" cy="37" r="2.5"/><circle cx="115" cy="37" r="2.5"/>
      <circle cx="145" cy="37" r="2.5"/><circle cx="165" cy="37" r="2.5"/>
    </g>
    <!-- left finger splayed out -->
    <line class="link" x1="80"  y1="52" x2="20"  y2="150"/>
    <line class="link" x1="110" y1="52" x2="40"  y2="150"/>
    <polygon class="tip" points="18,150 42,150 34,200 10,196"/>
    <!-- right finger splayed out -->
    <line class="link" x1="180" y1="52" x2="240" y2="150"/>
    <line class="link" x1="150" y1="52" x2="220" y2="150"/>
    <polygon class="tip" points="218,150 242,150 250,196 226,200"/>
    <g class="pivot">
      <circle cx="80" cy="52" r="3"/><circle cx="110" cy="52" r="3"/>
      <circle cx="150" cy="52" r="3"/><circle cx="180" cy="52" r="3"/>
    </g>

    <!-- dimension: open tip-to-tip ~130 mm -->
    <line class="dim" x1="26" y1="215" x2="240" y2="215"/>
    <line class="dim" x1="26" y1="208" x2="26" y2="222"/>
    <line class="dim" x1="240" y1="208" x2="240" y2="222"/>
    <text class="dimt" x="133" y="230" text-anchor="middle">open span ~130 mm (approx)</text>
  </g>

  <!-- shared dimensions on the closed view -->
  <g>
    <!-- palm width ~90 -->
    <line class="dim" x1="20" y1="68" x2="160" y2="68"/>
    <line class="dim" x1="20" y1="61" x2="20" y2="75"/>
    <line class="dim" x1="160" y1="61" x2="160" y2="75"/>
    <text class="dimt" x="90" y="83" text-anchor="middle">palm ~90 mm</text>
    <!-- palm height ~30 -->
    <line class="dim" x1="172" y1="22" x2="172" y2="52"/>
    <text class="dimt" x="176" y="40">~30</text>
    <!-- finger length ~110 -->
    <line class="dim" x1="175" y1="52" x2="200" y2="150"/>
    <text class="dimt" x="200" y="110">finger ~110 mm</text>
    <!-- overall height closed ~195 -->
    <line class="dim" x1="200" y1="0" x2="200" y2="195"/>
    <text class="dimt" x="204" y="130" transform="rotate(90 204,130)">overall ~195 mm (approx)</text>
  </g>

  <!-- legend -->
  <g transform="translate(0,250)">
    <text class="lbl" x="0" y="40" font-weight="bold">ROB3 gripper (axis 5) - front view</text>
    <text class="lbl" x="0" y="58">Type: two-finger four-bar (scissor) linkage; angular jaws, driven from the wrist gearbox.</text>
    <text class="lbl" x="0" y="74">Grid = 5 mm (from graph paper in photos). Dimensions are APPROXIMATE [INFER] - replace with caliper [HW].</text>
    <text class="dimt" x="0" y="112">Needed [HW] measurements: palm plate W×H×thickness, link length, link pivot spacing,</text>
    <text class="dimt" x="0" y="128">fingertip length, closed gap, open span, wrist-hub diameter &amp; height.</text>
  </g>
</svg>
